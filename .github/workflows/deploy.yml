name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Pages deployment can fail for reasons that have nothing to do with the
  # build — it returned a 503 outage on 2026-08-17 with the artifact already
  # uploaded. Re-running the failed job is not the fix: it re-runs the upload
  # step too, leaving two artifacts named "github-pages" in the same run, and
  # deploy-pages then refuses to choose between them. A manual trigger gives a
  # clean new run without inventing an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
